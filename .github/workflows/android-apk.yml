name: Build CashTrack APK (Testing Artifact Only)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found in the Android SDK installation."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configure persistent debug signing key
        shell: bash
        env:
          CASH_TRACK_DEBUG_KEYSTORE_BASE64: ${{ secrets.CASH_TRACK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$CASH_TRACK_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret CASH_TRACK_DEBUG_KEYSTORE_BASE64 is missing. Add the Base64 contents of the saved keystore file in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$CASH_TRACK_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK for download
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CashTrack-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashTrack-debug-apk
          path: app/build/outputs/apk/debug/CashTrack-debug.apk
          if-no-files-found: error
          retention-days: 14

